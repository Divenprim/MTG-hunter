name: Cleanup accidental release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove accidental vv1.19.1 releases and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/releases/397097591" || true
          gh api -X DELETE "repos/${{ github.repository }}/releases/397097336" || true
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/vv1.19.1" || true
