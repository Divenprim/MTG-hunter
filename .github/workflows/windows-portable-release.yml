name: Windows portable release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build dependencies for offline card database
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
        run: python -m pip install -r requirements.txt

      - name: Build card database for offline release
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
        env:
          MTGH_RUSSIAN_BULK: "1"
        run: python build_db.py

      - name: Build Commander Spellbook database for offline release
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
        run: python -c "from app.combos import build; print(build())"

      - name: Download mandatory prebuilt art fingerprint database
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force data | Out-Null
          gh release download art-db-current --pattern art_hashes.sqlite --dir data --clobber
          if (-not (Test-Path data/art_hashes.sqlite)) { throw "art_hashes.sqlite was not downloaded" }

      - name: Run full test suite
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          MTGH_DATA_DIR: ${{ runner.temp }}\\mtgh-tests
        run: python -m unittest discover -s tests -p "test_*.py"


      - name: Install image-cache test dependency
        if: github.ref == 'refs/heads/main'
        run: python -m pip install requests

      - name: Test image cache offline behavior
        run: python -m unittest discover -s tests -p "test_imagecache.py"

      - name: Build portable release
        if: github.ref == 'refs/heads/main'
        run: python release/build_portable.py --output dist

      - name: Build complete user release
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
        run: python release/build_portable.py --output dist --require-art

      - name: Verify portable release
        if: github.ref == 'refs/heads/main'
        run: python release/verify_portable.py dist/MTG-Hunter

      - name: Verify complete user release
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
        run: python release/verify_portable.py dist/MTG-Hunter --require-art

      - name: Verify offline card database is bundled
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
        run: runtime/python.exe build_db.py --check
        working-directory: dist/MTG-Hunter

      - name: Verify Gatherer fallback identifiers are bundled
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
        run: runtime/python.exe -c "import sqlite3; c=sqlite3.connect('data/cards.sqlite'); assert c.execute('SELECT COUNT(*) FROM card_external_ids WHERE multiverse_id IS NOT NULL').fetchone()[0] > 1000"
        working-directory: dist/MTG-Hunter


      - name: Verify offline combo database is bundled
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
        run: runtime/python.exe -c "from app.combos import ComboDB; assert ComboDB().ready"
        working-directory: dist/MTG-Hunter

      - name: Verify full visual fingerprint database is bundled
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
        run: >-
          runtime/python.exe -c "from app.artscan import status,printings_to_hash; s=status(); n=len(printings_to_hash('all')); print(s,'target',n); assert s['built']; assert s['scope']=='all'; assert s['hashed'] >= int(n*0.995)"
        working-directory: dist/MTG-Hunter

      - name: End-to-end portable LAN and HTTPS smoke test
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
        run: python release/smoke_portable.py dist/MTG-Hunter


      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTG-Hunter-Windows-portable
          path: dist/MTG-Hunter-Windows-portable.zip
          if-no-files-found: error

      - name: Create release from release branch
        if: startsWith(github.ref, 'refs/heads/release/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}" -replace '^release/', ''
          $version = $version -replace '^v', ''
          $tag = "v$version"
          gh release create $tag `
            "dist/MTG-Hunter-Windows-portable.zip" `
            --target "${{ github.sha }}" `
            --title "$version — portable Windows release" `
            --notes "Самодостаточный Windows-релиз: Python 3.12 и все runtime-зависимости уже внутри. Скачайте MTG-Hunter-Windows-portable.zip, распакуйте и запустите MTG-Hunter.bat."

      - name: Attach ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MTG-Hunter-Windows-portable.zip
