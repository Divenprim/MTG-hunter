name: Windows portable release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Build portable release
        run: python release/build_portable.py --output dist

      - name: Verify portable release
        run: python release/verify_portable.py dist/MTG-Hunter

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTG-Hunter-Windows-portable
          path: dist/MTG-Hunter-Windows-portable.zip
          if-no-files-found: error

      - name: Attach ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MTG-Hunter-Windows-portable.zip
