name: Windows portable release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build dependencies for offline card database
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
        run: python -m pip install -r requirements.txt

      - name: Build card database for offline release
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
        env:
          MTGH_RUSSIAN_BULK: "1"
        run: python build_db.py

      - name: Build Commander Spellbook database for offline release
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
        run: python -c "from app.combos import build; print(build())"

      - name: Download mandatory prebuilt art fingerprint database
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force data | Out-Null
          gh release download art-db-current --pattern art_hashes.sqlite --dir data --clobber
          if (-not (Test-Path data/art_hashes.sqlite)) { throw "art_hashes.sqlite was not downloaded" }

      # Набор тестов ходит по программе через TestClient, а тот просит httpx2.
      # Без этого три проверки падают ошибкой импорта -- и релиз не собирается,
      # хотя с самой программой всё в порядке. Ставится только то, что нужно
      # тестам: playwright с браузером здесь не запускается.
      # Нужны и на main: полный набор тестов теперь гоняется везде.
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt "httpx2>=2.12" "httpx>=0.27" "esprima>=4.0"

      # Без условия по ветке. Раньше полный набор шёл только для релизных
      # веток и тегов, а на main оставались два файла из полусотни -- то есть
      # почти тысяча тестов жила исключительно на машине разработчика и ничего
      # в репозитории не защищала.
      - name: Run full test suite
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          MTGH_DATA_DIR: ${{ runner.temp }}\\mtgh-tests
        run: python -m unittest discover -s tests -p "test_*.py"


      - name: Install lightweight main-branch test dependencies
        if: github.ref == 'refs/heads/main'
        run: python -m pip install requests cryptography

      # 35 файлов tests/ui_*.py не подпадают под шаблон test_*.py и не были
      # упомянуты нигде: ни в сборке, ни в батниках. Про такой набор легко
      # решить, что он зелёный, -- а он проверяет то, что видит человек.
      #
      # Гоняются только на релизных ветках и тегах: им нужен поднятый сервер и
      # браузер, это дороже обычных тестов. Зато ни один релиз больше не уедет
      # с разъехавшимся интерфейсом.
      - name: Browser scenarios
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          MTGH_UI_BASE: "http://127.0.0.1:8799"
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          $server = Start-Process python -ArgumentList @(
            "-m","uvicorn","app.main:app","--host","127.0.0.1","--port","8799"
          ) -PassThru
          try {
            $ready = $false
            foreach ($i in 1..60) {
              try {
                Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8799/openapi.json" | Out-Null
                $ready = $true; break
              } catch { Start-Sleep -Seconds 2 }
            }
            if (-not $ready) { throw "сервер не поднялся за две минуты" }
            $failed = @()
            foreach ($f in Get-ChildItem tests/ui_*.py) {
              Write-Host "--- $($f.Name)"
              python $f.FullName
              if ($LASTEXITCODE -ne 0) { $failed += $f.Name }
            }
            if ($failed.Count -gt 0) { throw "не сошлось: $($failed -join ', ')" }
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

      - name: Test image cache offline behavior
        run: python -m unittest discover -s tests -p "test_imagecache.py"

      - name: Test portable LAN and certificate helpers
        if: github.ref == 'refs/heads/main'
        run: python -m unittest discover -s tests -p "test_portable_network.py"

      - name: Build portable release
        if: github.ref == 'refs/heads/main'
        run: python release/build_portable.py --output dist

      - name: Build complete user release
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
        run: python release/build_portable.py --output dist --require-art

      - name: Verify portable release
        if: github.ref == 'refs/heads/main'
        run: python release/verify_portable.py dist/MTG-Hunter

      - name: Verify complete user release
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
        run: python release/verify_portable.py dist/MTG-Hunter --require-art

      - name: Verify offline card database is bundled
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
        run: runtime/python.exe build_db.py --check
        working-directory: dist/MTG-Hunter

      - name: Verify Gatherer fallback identifiers are bundled
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
        run: runtime/python.exe -c "import sqlite3; c=sqlite3.connect('data/cards.sqlite'); assert c.execute('SELECT COUNT(*) FROM card_external_ids WHERE multiverse_id IS NOT NULL').fetchone()[0] > 1000"
        working-directory: dist/MTG-Hunter


      - name: Verify offline combo database is bundled
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
        run: runtime/python.exe -c "from app.combos import ComboDB; assert ComboDB().ready"
        working-directory: dist/MTG-Hunter

      - name: Verify full visual fingerprint database is bundled
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
        run: >-
          runtime/python.exe -c "from app.artscan import status,printings_to_hash; s=status(); n=len(printings_to_hash('all')); print(s,'target',n); assert s['built']; assert s.get('complete'); assert s['scope']=='all'; assert s['hashed'] >= int(n*0.995)"
        working-directory: dist/MTG-Hunter

      - name: End-to-end portable LAN and HTTPS smoke test
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
        run: python release/smoke_portable.py dist/MTG-Hunter


      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTG-Hunter-Windows-portable
          path: dist/MTG-Hunter-Windows-portable.zip
          if-no-files-found: error

      - name: Create release from release branch
        if: startsWith(github.ref, 'refs/heads/release/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}" -replace '^release/', ''
          $version = $version -replace '^v', ''
          $tag = "v$version"
          gh release create $tag `
            "dist/MTG-Hunter-Windows-portable.zip" `
            --target "${{ github.sha }}" `
            --title "$version — portable Windows release" `
            --notes "Самодостаточный Windows-релиз: Python 3.12 и все runtime-зависимости уже внутри. Скачайте MTG-Hunter-Windows-portable.zip, распакуйте и запустите MTG-Hunter.bat."

      - name: Attach ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MTG-Hunter-Windows-portable.zip
