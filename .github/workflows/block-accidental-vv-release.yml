name: Block accidental double-v release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  block:
    runs-on: ubuntu-latest
    steps:
      - name: Reserve accidental tag as hidden draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view vv1.19.1 --repo "${{ github.repository }}" >/dev/null 2>&1 || \
          gh release create vv1.19.1 --repo "${{ github.repository }}" --draft --title "reserved" --notes "temporary guard"
