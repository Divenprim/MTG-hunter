name: Cancel monolithic art build

on:
  push:
    branches:
      - main

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel monolithic run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel 36307015554 --repo "${{ github.repository }}" || true
