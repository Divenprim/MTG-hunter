name: Art fingerprint database

on:
  workflow_dispatch:
  push:
    branches:
      - "art-db/**"

permissions:
  contents: write

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      MTGH_ART_API_RATE: "1.2"
      MTGH_ART_GATHERER_RATE: "3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build current card database
        env:
          MTGH_RUSSIAN_BULK: "1"
        run: python build_db.py

      - name: Seed from previous rolling database when available
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force data | Out-Null
          $out = "data/art-shard-${{ matrix.shard }}.sqlite"
          gh release view art-db-current 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release download art-db-current --pattern art_hashes.sqlite --dir data --clobber
            if ($LASTEXITCODE -ne 0) { throw "failed to download previous art database" }
            Copy-Item data/art_hashes.sqlite $out -Force
            Remove-Item data/art_hashes.sqlite -Force
          } else {
            Write-Host "No previous art database; shard starts empty."
            $global:LASTEXITCODE = 0
          }

      - name: Build fingerprint shard
        run: >-
          python build_art.py --all
          --shard-index ${{ matrix.shard }} --shard-count 6
          --workers 24 --rate 40
          --output data/art-shard-${{ matrix.shard }}.sqlite

      - name: Upload shard
        uses: actions/upload-artifact@v4
        with:
          name: art-shard-${{ matrix.shard }}
          path: data/art-shard-${{ matrix.shard }}.sqlite
          if-no-files-found: error
          retention-days: 7

  merge:
    needs: shard
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      MTGH_ART_API_RATE: "8"
      MTGH_ART_GATHERER_RATE: "12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build current card database
        env:
          MTGH_RUSSIAN_BULK: "1"
        run: python build_db.py

      - name: Download shards
        uses: actions/download-artifact@v4
        with:
          pattern: art-shard-*
          path: art-shards
          merge-multiple: true

      - name: Merge shards
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force data | Out-Null
          $parts = Get-ChildItem art-shards -Filter "*.sqlite" | ForEach-Object { $_.FullName }
          if ($parts.Count -ne 6) { throw "expected 6 art shards, got $($parts.Count)" }
          python release/merge_art_hashes.py data/art_hashes.sqlite $parts

      - name: Retry missing fingerprints conservatively
        run: python build_art.py --all --workers 20 --rate 20 --output data/art_hashes.sqlite

      - name: Verify full fingerprint coverage
        run: >-
          python -c "from app.artscan import status,printings_to_hash;
          s=status(); n=len(printings_to_hash('all'));
          print(s,'target',n);
          assert s['scope']=='all';
          assert s.get('complete');
          assert s['hashed'] >= int(n*0.995);
          assert s['failed'] <= max(50,int(n*0.005))"

      - name: Verify standalone SQLite has no required WAL sidecar
        shell: pwsh
        run: |
          if (Test-Path data/art_hashes.sqlite-wal) {
            if ((Get-Item data/art_hashes.sqlite-wal).Length -gt 0) {
              throw "art database still depends on WAL sidecar"
            }
          }
          python -c "import sqlite3; c=sqlite3.connect('file:data/art_hashes.sqlite?mode=ro',uri=True); print(c.execute('select count(*) from art').fetchone()[0]); c.close()"

      - name: Upload reusable artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTG-Hunter-art-hashes
          path: data/art_hashes.sqlite
          if-no-files-found: error
          retention-days: 90

      - name: Publish rolling art database asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view art-db-current 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create art-db-current --prerelease --title "MTG Hunter art fingerprint database" --notes "Rolling prebuilt visual fingerprint database used by portable releases."
          }
          gh release upload art-db-current data/art_hashes.sqlite --clobber
